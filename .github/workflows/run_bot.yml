name: Run Telegram Bot Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run_bot.yml"
      - "build_dashboard.py"
      - "eldis_collector.py"
      - "meter_analytics.py"
      - "telegram_bot.py"
      - "telegram_bot_service.py"
      - "telegram_report.py"
      - "weather_fetcher.py"

permissions:
  contents: read
  actions: write

concurrency:
  group: telegram-bot-polling
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    env:
      # Подтягиваем переменные для Элдис, чтобы скрипт мог собрать данные
      ELDIS_API_BASE: ${{ vars.ELDIS_API_BASE || 'https://api.eldis24.ru/api/v1' }}
      ELDIS_LOOKBACK_MONTHS: ${{ vars.ELDIS_LOOKBACK_MONTHS || '2' }}
      ELDIS_TIMEOUT: ${{ vars.ELDIS_TIMEOUT || '60' }}
      ELDIS_REQUEST_PAUSE_SECONDS: ${{ vars.ELDIS_REQUEST_PAUSE_SECONDS || '0' }}
      BOT_REFRESH_SECONDS: ${{ vars.BOT_REFRESH_SECONDS || '1800' }}

      ELDIS_ACCOUNT_1_NAME: ${{ vars.ELDIS_ACCOUNT_1_NAME || 'account_1' }}
      ELDIS_ACCOUNT_1_KEY: ${{ secrets.ELDIS_ACCOUNT_1_KEY }}
      ELDIS_ACCOUNT_1_LOGIN: ${{ secrets.ELDIS_ACCOUNT_1_LOGIN }}
      ELDIS_ACCOUNT_1_PASSWORD: ${{ secrets.ELDIS_ACCOUNT_1_PASSWORD }}

      ELDIS_ACCOUNT_2_NAME: ${{ vars.ELDIS_ACCOUNT_2_NAME || 'account_2' }}
      ELDIS_ACCOUNT_2_KEY: ${{ secrets.ELDIS_ACCOUNT_2_KEY }}
      ELDIS_ACCOUNT_2_LOGIN: ${{ secrets.ELDIS_ACCOUNT_2_LOGIN }}
      ELDIS_ACCOUNT_2_PASSWORD: ${{ secrets.ELDIS_ACCOUNT_2_PASSWORD }}

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_CHAT_IDS: ${{ vars.TELEGRAM_ALLOWED_CHAT_IDS || secrets.TELEGRAM_ALLOWED_CHAT_IDS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run bot service
        run: |
          set +e
          timeout 20700 python telegram_bot_service.py
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            exit "$code"
          fi

      - name: Start next bot run
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run run_bot.yml --ref "${GITHUB_REF_NAME}"
